bio: |
  I'm a PhD candidate in Oncology & Bioinformatics at the Faculty of Medicine &
  Pharmacy, Mohammed V University in Rabat. My research sits where computational
  drug discovery meets cancer genomics: I use structural bioinformatics, molecular
  dynamics and machine learning to find and test new therapeutic ideas in silico,
  and to bring that discovery closer to translational oncology.

  I'm also a science communicator. I write about cancer biology, in silico drug
  discovery, coding in science, women in STEM and researcher wellbeing, aiming to
  make computational biology accessible to everyone. 🌸

